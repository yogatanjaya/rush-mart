[package]
name = "rushmart"
version = "0.1.0"
edition = "2021"
description = "Rush Mart — on-chain activity ledger + NEP-245 harvest tokens"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# near-sdk 5.30 menolak kompilasi native (non-wasm) kecuali fitur ini aktif.
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
