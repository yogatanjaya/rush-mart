<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Layout Farm — v1</title>
<style>
  :root{--ink:#2b1d0e;--paper:#fff8ec;--line:#d9c3a3;--fence:#8d5722;
        --soil:#d8b98a;--soil-dark:#c3a06d;--plot:#b98d5c;--plot-dark:#9c7345}
  *{box-sizing:border-box}
  body{margin:0;background:#f2ece2;color:var(--ink);
       font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:20px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:#7a6a52;font-size:13px;margin-bottom:14px}
  .card{background:var(--paper);border:2px solid var(--line);border-radius:16px;
        padding:12px;box-shadow:0 6px 0 #00000010}
  svg{width:100%;height:auto;display:block;border-radius:10px}
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#5a4b34}
  .legend i{display:inline-block;width:20px;height:14px;border-radius:3px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <h1>Farm — layout top-down (v1)</h1>
  <div class="sub">4 lahan berkawat kayu · 9 slot per lahan · jalan tanah untuk lalu lalang</div>

  <div class="card">
  <svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="dirt" width="44" height="44" patternUnits="userSpaceOnUse">
        <rect width="44" height="44" fill="#d8b98a"/>
        <circle cx="9" cy="12" r="1.6" fill="#c3a06d"/>
        <circle cx="30" cy="30" r="1.4" fill="#c3a06d"/>
        <circle cx="20" cy="38" r="1.2" fill="#c3a06d"/>
        <circle cx="38" cy="9" r="1.2" fill="#c3a06d"/>
      </pattern>
      <pattern id="plotsoil" width="30" height="30" patternUnits="userSpaceOnUse">
        <rect width="30" height="30" fill="#b98d5c"/>
        <path d="M0 30 L30 30" stroke="#a87c4c" stroke-width="2"/>
      </pattern>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
      </filter>

      <!-- simbol bibit / tanaman -->
      <symbol id="sprout" viewBox="-16 -20 32 40">
        <path d="M0 16 L0 -2" stroke="#4f8a3a" stroke-width="3"/>
        <path d="M0 -2 q-12 -4 -12 -14 q12 2 12 14z" fill="#6bb04f"/>
        <path d="M0 -2 q12 -4 12 -14 q-12 2 -12 14z" fill="#4f9d4a"/>
      </symbol>
      <symbol id="ready" viewBox="-18 -22 36 44">
        <path d="M0 18 L0 -2" stroke="#3f7a2c" stroke-width="3"/>
        <ellipse cx="0" cy="4" rx="12" ry="10" fill="#e8873c" stroke="#b25f1e" stroke-width="2"/>
        <path d="M0 -2 q-11 -6 -10 -16 q11 3 10 16z" fill="#4f9d4a"/>
        <path d="M0 -2 q11 -6 10 -16 q-11 3 -10 16z" fill="#6bb04f"/>
      </symbol>
    </defs>

    <!-- ============ HUD HORIZONTAL ============ -->
    <rect x="0" y="0" width="1200" height="80" fill="#fffdf7"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#d9c3a3" stroke-width="3"/>

    <g font-size="15" font-weight="700" fill="#2b1d0e">
      <rect x="20" y="20" width="140" height="40" rx="9" fill="#eef7ee" stroke="#4f9d4a" stroke-width="3"/>
      <text x="90" y="46" text-anchor="middle">🌱 BUY SEED</text>

      <rect x="172" y="20" width="182" height="40" rx="9" fill="#eef2fb" stroke="#3a6fd8" stroke-width="3"/>
      <text x="263" y="46" text-anchor="middle">🏪 KE MINIMARKET</text>

      <rect x="366" y="20" width="150" height="40" rx="9" fill="#fff6e6" stroke="#8d5722" stroke-width="3"/>
      <text x="441" y="46" text-anchor="middle">🎒 INVENTORY</text>
    </g>
    <g>
      <rect x="900" y="20" width="270" height="40" rx="9" fill="#fff9e8" stroke="#c9a227" stroke-width="3"/>
      <text x="1035" y="46" text-anchor="middle" font-size="16" font-weight="800">
        💰 SALDO: 150 koin
      </text>
    </g>

    <!-- ============ AREA FARM ============ -->
    <rect x="30" y="96" width="1140" height="700" rx="14" fill="url(#dirt)" stroke="#b08a5a" stroke-width="6"/>

    <!-- ===== LAHAN 1 : JAGUNG ===== -->
    <g filter="url(#soft)">
      <rect x="120" y="250" width="300" height="240" rx="10" fill="url(#plotsoil)" stroke="#7a5528" stroke-width="5"/>
      <!-- pagar kayu atas & bawah -->
      <g stroke="#8d5722" stroke-width="7" stroke-linecap="round">
        <line x1="112" y1="242" x2="428" y2="242"/>
        <line x1="112" y1="498" x2="428" y2="498"/>
        <line x1="112" y1="242" x2="112" y2="498"/>
        <line x1="428" y1="242" x2="428" y2="498"/>
      </g>
      <g fill="#8d5722">
        <rect x="104" y="232" width="12" height="18" rx="3"/><rect x="256" y="232" width="12" height="18" rx="3"/>
        <rect x="416" y="232" width="12" height="18" rx="3"/>
        <rect x="104" y="490" width="12" height="18" rx="3"/><rect x="256" y="490" width="12" height="18" rx="3"/>
        <rect x="416" y="490" width="12" height="18" rx="3"/>
      </g>
      <!-- 9 slot -->
      <g stroke="#7a5528" stroke-width="2" fill="#cfa06c">
        <rect x="140" y="270" width="80" height="60" rx="6"/>
        <rect x="230" y="270" width="80" height="60" rx="6"/>
        <rect x="320" y="270" width="80" height="60" rx="6"/>
        <rect x="140" y="340" width="80" height="60" rx="6"/>
        <rect x="230" y="340" width="80" height="60" rx="6"/>
        <rect x="320" y="340" width="80" height="60" rx="6"/>
        <rect x="140" y="410" width="80" height="60" rx="6"/>
        <rect x="230" y="410" width="80" height="60" rx="6"/>
        <rect x="320" y="410" width="80" height="60" rx="6"/>
      </g>
      <!-- contoh: 2 slot sudah ditanam -->
      <use href="#sprout" x="252" y="330" width="34" height="42"/>
      <use href="#sprout" x="342" y="400" width="34" height="42"/>
    </g>
    <g>
      <rect x="150" y="204" width="240" height="30" rx="7" fill="#fffdf7" stroke="#7a5528" stroke-width="3"/>
      <text x="270" y="225" text-anchor="middle" font-size="16" font-weight="800">🌽 JAGUNG · 2/9</text>
    </g>

    <!-- ===== LAHAN 2 : TOMAT ===== -->
    <g filter="url(#soft)">
      <rect x="520" y="250" width="300" height="240" rx="10" fill="url(#plotsoil)" stroke="#7a5528" stroke-width="5"/>
      <g stroke="#8d5722" stroke-width="7" stroke-linecap="round">
        <line x1="512" y1="242" x2="828" y2="242"/>
        <line x1="512" y1="498" x2="828" y2="498"/>
        <line x1="512" y1="242" x2="512" y2="498"/>
        <line x1="828" y1="242" x2="828" y2="498"/>
      </g>
      <g fill="#8d5722">
        <rect x="504" y="232" width="12" height="18" rx="3"/><rect x="656" y="232" width="12" height="18" rx="3"/>
        <rect x="816" y="232" width="12" height="18" rx="3"/>
        <rect x="504" y="490" width="12" height="18" rx="3"/><rect x="656" y="490" width="12" height="18" rx="3"/>
        <rect x="816" y="490" width="12" height="18" rx="3"/>
      </g>
      <g stroke="#7a5528" stroke-width="2" fill="#cfa06c">
        <rect x="540" y="270" width="80" height="60" rx="6"/>
        <rect x="630" y="270" width="80" height="60" rx="6"/>
        <rect x="720" y="270" width="80" height="60" rx="6"/>
        <rect x="540" y="340" width="80" height="60" rx="6"/>
        <rect x="630" y="340" width="80" height="60" rx="6"/>
        <rect x="720" y="340" width="80" height="60" rx="6"/>
        <rect x="540" y="410" width="80" height="60" rx="6"/>
        <rect x="630" y="410" width="80" height="60" rx="6"/>
        <rect x="720" y="410" width="80" height="60" rx="6"/>
      </g>
      <use href="#sprout" x="652" y="330" width="34" height="42"/>
    </g>
    <g>
      <rect x="550" y="204" width="240" height="30" rx="7" fill="#fffdf7" stroke="#7a5528" stroke-width="3"/>
      <text x="670" y="225" text-anchor="middle" font-size="16" font-weight="800">🍅 TOMAT · 1/9</text>
    </g>

    <!-- ===== LAHAN 3 : WORTEL ===== -->
    <g filter="url(#soft)">
      <rect x="120" y="550" width="300" height="240" rx="10" fill="url(#plotsoil)" stroke="#7a5528" stroke-width="5"/>
      <g stroke="#8d5722" stroke-width="7" stroke-linecap="round">
        <line x1="112" y1="542" x2="428" y2="542"/>
        <line x1="112" y1="798" x2="428" y2="798"/>
        <line x1="112" y1="542" x2="112" y2="798"/>
        <line x1="428" y1="542" x2="428" y2="798"/>
      </g>
      <g fill="#8d5722">
        <rect x="104" y="532" width="12" height="18" rx="3"/><rect x="256" y="532" width="12" height="18" rx="3"/>
        <rect x="416" y="532" width="12" height="18" rx="3"/>
        <rect x="104" y="790" width="12" height="18" rx="3"/><rect x="256" y="790" width="12" height="18" rx="3"/>
        <rect x="416" y="790" width="12" height="18" rx="3"/>
      </g>
      <g stroke="#7a5528" stroke-width="2" fill="#cfa06c">
        <rect x="140" y="570" width="80" height="60" rx="6"/>
        <rect x="230" y="570" width="80" height="60" rx="6"/>
        <rect x="320" y="570" width="80" height="60" rx="6"/>
        <rect x="140" y="640" width="80" height="60" rx="6"/>
        <rect x="230" y="640" width="80" height="60" rx="6"/>
        <rect x="320" y="640" width="80" height="60" rx="6"/>
        <rect x="140" y="710" width="80" height="60" rx="6"/>
        <rect x="230" y="710" width="80" height="60" rx="6"/>
        <rect x="320" y="710" width="80" height="60" rx="6"/>
      </g>
    </g>
    <g>
      <rect x="150" y="504" width="240" height="30" rx="7" fill="#fffdf7" stroke="#7a5528" stroke-width="3"/>
      <text x="270" y="525" text-anchor="middle" font-size="16" font-weight="800">🥕 WORTEL · 0/9</text>
    </g>

    <!-- ===== LAHAN 4 : KENTANG ===== -->
    <g filter="url(#soft)">
      <rect x="520" y="550" width="300" height="240" rx="10" fill="url(#plotsoil)" stroke="#7a5528" stroke-width="5"/>
      <g stroke="#8d5722" stroke-width="7" stroke-linecap="round">
        <line x1="512" y1="542" x2="828" y2="542"/>
        <line x1="512" y1="798" x2="828" y2="798"/>
        <line x1="512" y1="542" x2="512" y2="798"/>
        <line x1="828" y1="542" x2="828" y2="798"/>
      </g>
      <g fill="#8d5722">
        <rect x="504" y="532" width="12" height="18" rx="3"/><rect x="656" y="532" width="12" height="18" rx="3"/>
        <rect x="816" y="532" width="12" height="18" rx="3"/>
        <rect x="504" y="790" width="12" height="18" rx="3"/><rect x="656" y="790" width="12" height="18" rx="3"/>
        <rect x="816" y="790" width="12" height="18" rx="3"/>
      </g>
      <g stroke="#7a5528" stroke-width="2" fill="#cfa06c">
        <rect x="540" y="570" width="80" height="60" rx="6"/>
        <rect x="630" y="570" width="80" height="60" rx="6"/>
        <rect x="720" y="570" width="80" height="60" rx="6"/>
        <rect x="540" y="640" width="80" height="60" rx="6"/>
        <rect x="630" y="640" width="80" height="60" rx="6"/>
        <rect x="720" y="640" width="80" height="60" rx="6"/>
        <rect x="540" y="710" width="80" height="60" rx="6"/>
        <rect x="630" y="710" width="80" height="60" rx="6"/>
        <rect x="720" y="710" width="80" height="60" rx="6"/>
      </g>
      <use href="#ready" x="652" y="630" width="34" height="42"/>
    </g>
    <g>
      <rect x="550" y="504" width="240" height="30" rx="7" fill="#fffdf7" stroke="#7a5528" stroke-width="3"/>
      <text x="670" y="525" text-anchor="middle" font-size="16" font-weight="800">🥔 KENTANG · 1/9</text>
    </g>

    <!-- ===== JALAN TANAH (tengah) ===== -->
    <g stroke="#b08a5a" stroke-width="3" stroke-dasharray="8 8" opacity="0.6">
      <line x1="470" y1="140" x2="470" y2="770"/>
      <line x1="80" y1="520" x2="880" y2="520"/>
    </g>

    <!-- ===== PAPAN ARAH KE MINIMARKET ===== -->
    <g filter="url(#soft)">
      <rect x="920" y="330" width="230" height="120" rx="12" fill="#fffdf7" stroke="#8d5722" stroke-width="4"/>
      <text x="1035" y="368" text-anchor="middle" font-size="15" font-weight="800">KELUAR FARM</text>
      <text x="1035" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6fd8">→ MINIMARKET</text>
      <path d="M1035 406 L1035 432 M1019 418 L1035 434 L1051 418"
            stroke="#3a6fd8" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- ===== GUDANG KECIL ===== -->
    <g filter="url(#soft)">
      <rect x="920" y="520" width="200" height="150" rx="10" fill="#c98a4b" stroke="#7a5528" stroke-width="5"/>
      <path d="M910 520 L1020 460 L1130 520 z" fill="#a86c33" stroke="#7a5528" stroke-width="4"/>
      <rect x="995" y="590" width="60" height="80" rx="6" fill="#8d5722"/>
      <text x="1020" y="560" text-anchor="middle" font-size="15" font-weight="800" fill="#fffdf7">GUDANG</text>
    </g>

    <!-- ===== PEMAIN ===== -->
    <g filter="url(#soft)">
      <circle cx="470" cy="520" r="19" fill="#f3c9a6" stroke="#8d5722" stroke-width="4"/>
      <path d="M452 516 q18 -25 36 0 q-8 -15 -18 -15 q-10 0 -18 15z" fill="#5a3320"/>
      <rect x="454" y="539" width="32" height="32" rx="9" fill="#e0713c" stroke="#a84f24" stroke-width="3"/>
      <text x="470" y="592" text-anchor="middle" font-size="13" font-weight="800">KAMU</text>
    </g>
  </svg>

  <div class="legend">
    <span><i style="background:#b98d5c"></i>lahan (9 slot)</span>
    <span><i style="background:#8d5722"></i>pagar kayu</span>
    <span><i style="background:#d8b98a"></i>jalan tanah</span>
    <span>🌱 bibit muda</span>
    <span>🥕 siap panen</span>
  </div>
  </div>
</div>
</body>
</html>
