<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Layout Minimarket — v2</title>
<style>
  :root{--ink:#2b1d0e;--paper:#fff8ec;--line:#d9c3a3;--wood:#c98a4b;--wood-dark:#a86c33;
        --floor:#f6e3c8;--green:#3f9d5a;--orange:#e0713c;--blue:#3a6fd8}
  *{box-sizing:border-box}
  body{margin:0;background:#f2ece2;color:var(--ink);
       font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1280px;margin:0 auto;padding:20px}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:#7a6a52;font-size:13px;margin-bottom:14px}
  .card{background:var(--paper);border:2px solid var(--line);border-radius:16px;
        padding:12px;box-shadow:0 6px 0 #00000010}
  svg{width:100%;height:auto;display:block;border-radius:10px}
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#5a4b34}
  .legend i{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <h1>Minimarket — layout top-down (v2)</h1>
  <div class="sub">4 rak kayu · 9 slot per rak · tombol horizontal · harga sudah diisi</div>

  <div class="card">
  <svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="floor" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#f6e3c8"/>
        <path d="M0 40 L40 40" stroke="#e8d2b0" stroke-width="2"/>
        <path d="M0 0 L0 40" stroke="#e8d2b0" stroke-width="1"/>
      </pattern>
      <linearGradient id="woodg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e3b183"/><stop offset="1" stop-color="#c98a4b"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
      </filter>

      <!-- simbol sayur -->
      <symbol id="corn" viewBox="-20 -26 40 52">
        <ellipse cx="0" cy="4" rx="12" ry="20" fill="#f2c63d" stroke="#b08a12" stroke-width="2"/>
        <path d="M-6 -12 L-6 20 M0 -14 L0 22 M6 -12 L6 20" stroke="#c99b18" stroke-width="2"/>
        <path d="M-12 -14 q-12 -12 -4 -22 q12 4 12 16z" fill="#4f9d4a"/>
        <path d="M12 -14 q12 -12 4 -22 q-12 4 -12 16z" fill="#4f9d4a"/>
      </symbol>
      <symbol id="tomato" viewBox="-20 -26 40 52">
        <circle cx="0" cy="4" r="15" fill="#e5483c" stroke="#a82a20" stroke-width="2"/>
        <path d="M0 -11 q8 -9 16 -3" stroke="#3f8a3a" stroke-width="3" fill="none"/>
        <circle cx="-5" cy="0" r="3" fill="#ffffff" opacity="0.35"/>
      </symbol>
      <symbol id="carrot" viewBox="-20 -26 40 52">
        <path d="M-8 -12 L8 -12 L2 22 z" fill="#e8873c" stroke="#b25f1e" stroke-width="2"/>
        <path d="M-4 -16 q2 -12 6 -12 M2 -16 q3 -12 7 -12" stroke="#4f9d4a" stroke-width="3" fill="none"/>
        <path d="M-3 -2 L4 -2 M-2 6 L4 6" stroke="#b25f1e" stroke-width="2"/>
      </symbol>
      <symbol id="potato" viewBox="-20 -26 40 52">
        <ellipse cx="0" cy="4" rx="17" ry="13" fill="#c99a63" stroke="#94693a" stroke-width="2"/>
        <circle cx="-7" cy="0" r="2" fill="#7a5528"/><circle cx="5" cy="6" r="2" fill="#7a5528"/>
        <circle cx="9" cy="-2" r="2" fill="#7a5528"/>
      </symbol>

      <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 z" fill="#3f9d5a"/>
      </marker>
      <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
        <path d="M0 0 L12 6 L0 12 z" fill="#e0713c"/>
      </marker>
    </defs>

    <!-- ============ HUD HORIZONTAL (atas) ============ -->
    <rect x="0" y="0" width="1200" height="80" fill="#fffdf7"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#d9c3a3" stroke-width="3"/>

    <g font-size="15" font-weight="700" fill="#2b1d0e">
      <rect x="20" y="20" width="140" height="40" rx="9" fill="#eef7ee" stroke="#4f9d4a" stroke-width="3"/>
      <text x="90" y="46" text-anchor="middle">🌱 BUY SEED</text>

      <rect x="172" y="20" width="130" height="40" rx="9" fill="#fff6e6" stroke="#8d5722" stroke-width="3"/>
      <text x="237" y="46" text-anchor="middle">🏡 KE FARM</text>

      <rect x="314" y="20" width="150" height="40" rx="9" fill="#eef2fb" stroke="#3a6fd8" stroke-width="3"/>
      <text x="389" y="46" text-anchor="middle">🎒 INVENTORY</text>
    </g>
    <!-- saldo -->
    <g>
      <rect x="900" y="20" width="270" height="40" rx="9" fill="#fff9e8" stroke="#c9a227" stroke-width="3"/>
      <text x="1035" y="46" text-anchor="middle" font-size="16" font-weight="800" fill="#2b1d0e">
        💰 SALDO: 100 koin
      </text>
    </g>

    <!-- ============ RUANGAN ============ -->
    <rect x="30" y="96" width="1140" height="700" rx="14" fill="url(#floor)" stroke="#c9ab84" stroke-width="6"/>
    <rect x="30" y="96" width="1140" height="22" rx="7" fill="#efe0c9" stroke="#c9ab84" stroke-width="3"/>

    <!-- ================= RAK (2x2, diturunkan) ================= -->
    <!-- RAK 1 JAGUNG -->
    <g filter="url(#soft)">
      <rect x="110" y="300" width="240" height="165" rx="10" fill="url(#woodg)" stroke="#8d5722" stroke-width="4"/>
      <rect x="122" y="312" width="216" height="141" rx="6" fill="#fff6e6" stroke="#b98a52" stroke-width="2"/>
      <line x1="122" y1="359" x2="338" y2="359" stroke="#b98a52" stroke-width="3"/>
      <line x1="122" y1="406" x2="338" y2="406" stroke="#b98a52" stroke-width="3"/>
      <use href="#corn" x="158" y="352" width="34" height="44"/>
      <use href="#corn" x="215" y="352" width="34" height="44"/>
      <use href="#corn" x="272" y="352" width="34" height="44"/>
      <use href="#corn" x="158" y="399" width="34" height="44"/>
      <use href="#corn" x="215" y="399" width="34" height="44"/>
      <use href="#corn" x="272" y="399" width="34" height="44"/>
      <use href="#corn" x="158" y="446" width="34" height="44"/>
      <use href="#corn" x="215" y="446" width="34" height="44"/>
      <use href="#corn" x="272" y="446" width="34" height="44"/>
    </g>
    <g>
      <rect x="126" y="268" width="208" height="30" rx="7" fill="#fffdf7" stroke="#8d5722" stroke-width="3"/>
      <text x="230" y="289" text-anchor="middle" font-size="17" font-weight="800">🌽 JAGUNG — 10</text>
    </g>

    <!-- RAK 2 TOMAT -->
    <g filter="url(#soft)">
      <rect x="378" y="300" width="240" height="165" rx="10" fill="url(#woodg)" stroke="#8d5722" stroke-width="4"/>
      <rect x="390" y="312" width="216" height="141" rx="6" fill="#fff6e6" stroke="#b98a52" stroke-width="2"/>
      <line x1="390" y1="359" x2="606" y2="359" stroke="#b98a52" stroke-width="3"/>
      <line x1="390" y1="406" x2="606" y2="406" stroke="#b98a52" stroke-width="3"/>
      <use href="#tomato" x="426" y="352" width="34" height="44"/>
      <use href="#tomato" x="483" y="352" width="34" height="44"/>
      <use href="#tomato" x="540" y="352" width="34" height="44"/>
      <use href="#tomato" x="426" y="399" width="34" height="44"/>
      <use href="#tomato" x="483" y="399" width="34" height="44"/>
      <use href="#tomato" x="540" y="399" width="34" height="44"/>
      <use href="#tomato" x="426" y="446" width="34" height="44"/>
      <use href="#tomato" x="483" y="446" width="34" height="44"/>
      <use href="#tomato" x="540" y="446" width="34" height="44"/>
    </g>
    <g>
      <rect x="394" y="268" width="208" height="30" rx="7" fill="#fffdf7" stroke="#8d5722" stroke-width="3"/>
      <text x="498" y="289" text-anchor="middle" font-size="17" font-weight="800">🍅 TOMAT — 15</text>
    </g>

    <!-- RAK 3 WORTEL -->
    <g filter="url(#soft)">
      <rect x="110" y="520" width="240" height="165" rx="10" fill="url(#woodg)" stroke="#8d5722" stroke-width="4"/>
      <rect x="122" y="532" width="216" height="141" rx="6" fill="#fff6e6" stroke="#b98a52" stroke-width="2"/>
      <line x1="122" y1="579" x2="338" y2="579" stroke="#b98a52" stroke-width="3"/>
      <line x1="122" y1="626" x2="338" y2="626" stroke="#b98a52" stroke-width="3"/>
      <use href="#carrot" x="158" y="572" width="34" height="44"/>
      <use href="#carrot" x="215" y="572" width="34" height="44"/>
      <use href="#carrot" x="272" y="572" width="34" height="44"/>
      <use href="#carrot" x="158" y="619" width="34" height="44"/>
      <use href="#carrot" x="215" y="619" width="34" height="44"/>
      <use href="#carrot" x="272" y="619" width="34" height="44"/>
      <use href="#carrot" x="158" y="666" width="34" height="44"/>
      <use href="#carrot" x="215" y="666" width="34" height="44"/>
      <use href="#carrot" x="272" y="666" width="34" height="44"/>
    </g>
    <g>
      <rect x="126" y="488" width="208" height="30" rx="7" fill="#fffdf7" stroke="#8d5722" stroke-width="3"/>
      <text x="230" y="509" text-anchor="middle" font-size="17" font-weight="800">🥕 WORTEL — 15</text>
    </g>

    <!-- RAK 4 KENTANG -->
    <g filter="url(#soft)">
      <rect x="378" y="520" width="240" height="165" rx="10" fill="url(#woodg)" stroke="#8d5722" stroke-width="4"/>
      <rect x="390" y="532" width="216" height="141" rx="6" fill="#fff6e6" stroke="#b98a52" stroke-width="2"/>
      <line x1="390" y1="579" x2="606" y2="579" stroke="#b98a52" stroke-width="3"/>
      <line x1="390" y1="626" x2="606" y2="626" stroke="#b98a52" stroke-width="3"/>
      <use href="#potato" x="426" y="572" width="34" height="44"/>
      <use href="#potato" x="483" y="572" width="34" height="44"/>
      <use href="#potato" x="540" y="572" width="34" height="44"/>
      <use href="#potato" x="426" y="619" width="34" height="44"/>
      <use href="#potato" x="483" y="619" width="34" height="44"/>
      <use href="#potato" x="540" y="619" width="34" height="44"/>
      <use href="#potato" x="426" y="666" width="34" height="44"/>
      <use href="#potato" x="483" y="666" width="34" height="44"/>
      <use href="#potato" x="540" y="666" width="34" height="44"/>
    </g>
    <g>
      <rect x="394" y="488" width="208" height="30" rx="7" fill="#fffdf7" stroke="#8d5722" stroke-width="3"/>
      <text x="498" y="509" text-anchor="middle" font-size="17" font-weight="800">🥔 KENTANG — 12</text>
    </g>

    <!-- ================= KASIR ================= -->
    <g filter="url(#soft)">
      <rect x="860" y="180" width="270" height="80" rx="10" fill="url(#woodg)" stroke="#8d5722" stroke-width="4"/>
      <!-- komputer -->
      <rect x="918" y="196" width="84" height="46" rx="6" fill="#e9eef7" stroke="#7a8798" stroke-width="3"/>
      <rect x="926" y="204" width="68" height="28" rx="3" fill="#8fb6e8"/>
      <rect x="950" y="242" width="20" height="8" fill="#7a8798"/>
      <rect x="930" y="250" width="60" height="6" rx="3" fill="#7a8798"/>
      <!-- kasir NPC -->
      <circle cx="1055" cy="204" r="14" fill="#f3c9a6" stroke="#8d5722" stroke-width="3"/>
      <path d="M1041 200 q14 -17 28 0 q-6 -12 -14 -12 q-8 0 -14 12z" fill="#4a2f1a"/>
      <rect x="1043" y="218" width="24" height="24" rx="6" fill="#3a6fd8" stroke="#26509e" stroke-width="2"/>
    </g>
    <g>
      <path d="M945 138 L945 176 M1045 138 L1045 176" stroke="#8d5722" stroke-width="4"/>
      <rect x="898" y="108" width="196" height="38" rx="9" fill="#fffdf7" stroke="#8d5722" stroke-width="4"/>
      <text x="996" y="135" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="2">CASHIER</text>
    </g>

    <!-- ================= ANTRIAN ================= -->
    <g>
      <rect x="866" y="276" width="258" height="112" rx="12" fill="#dfe9f7" stroke="#8fb6e8"
            stroke-width="3" stroke-dasharray="10 7"/>
      <text x="995" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#3a6fd8">AREA ANTRIAN</text>
      <g stroke="#8d5722" stroke-width="4">
        <line x1="878" y1="316" x2="1112" y2="316"/>
        <line x1="878" y1="350" x2="1112" y2="350"/>
      </g>
      <g fill="#8d5722">
        <rect x="874" y="308" width="10" height="50" rx="3"/>
        <rect x="1106" y="308" width="10" height="50" rx="3"/>
        <rect x="990" y="308" width="10" height="50" rx="3"/>
      </g>
      <text x="995" y="376" text-anchor="middle" font-size="12" fill="#6b7c93">antrian bayar</text>
    </g>

    <!-- ================= PINTU ================= -->
    <g>
      <rect x="1000" y="726" width="140" height="48" rx="8" fill="#bfe3c6" stroke="#4f9d4a" stroke-width="4"/>
      <text x="1070" y="757" text-anchor="middle" font-size="17" font-weight="800" fill="#20592c">PINTU</text>
      <g stroke="#8d5722" stroke-width="4">
        <line x1="912" y1="738" x2="986" y2="738"/>
        <line x1="912" y1="760" x2="986" y2="760"/>
      </g>
      <g fill="#8d5722">
        <rect x="908" y="730" width="9" height="38" rx="3"/>
        <rect x="980" y="730" width="9" height="38" rx="3"/>
      </g>
      <text x="947" y="716" text-anchor="middle" font-size="12" fill="#6b7c93">tali pembatas</text>
    </g>

    <!-- ================= JALUR NPC ================= -->
    <path d="M1070 718 L1070 462 L660 462 L660 392"
          fill="none" stroke="#3f9d5a" stroke-width="5" stroke-dasharray="12 9"
          marker-end="url(#arrowGreen)" opacity="0.7"/>
    <path d="M660 392 L660 148 L940 148 L940 176"
          fill="none" stroke="#e0713c" stroke-width="5" stroke-dasharray="12 9"
          marker-end="url(#arrowOrange)" opacity="0.7"/>
    <path d="M1136 220 L1160 220 L1160 700 L1136 700"
          fill="none" stroke="#e0713c" stroke-width="5" stroke-dasharray="12 9"
          marker-end="url(#arrowOrange)" opacity="0.5"/>

    <!-- ================= PEMAIN ================= -->
    <g filter="url(#soft)">
      <circle cx="820" cy="430" r="19" fill="#f3c9a6" stroke="#8d5722" stroke-width="4"/>
      <path d="M802 426 q18 -25 36 0 q-8 -15 -18 -15 q-10 0 -18 15z" fill="#5a3320"/>
      <rect x="804" y="449" width="32" height="32" rx="9" fill="#e0713c" stroke="#a84f24" stroke-width="3"/>
      <text x="820" y="502" text-anchor="middle" font-size="13" font-weight="800">KAMU</text>
    </g>
  </svg>

  <div class="legend">
    <span><i style="background:#3f9d5a"></i>jalur masuk &amp; belanja</span>
    <span><i style="background:#e0713c"></i>jalur bayar &amp; keluar</span>
    <span><i style="background:#8d5722"></i>tali pembatas</span>
  </div>
  </div>
</div>
</body>
</html>
