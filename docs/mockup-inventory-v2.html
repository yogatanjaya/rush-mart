<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Mockup INVENTORY v2 — Rush Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1a0d04;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "VT323", "Courier New", monospace;
    overflow: hidden;
  }

  /* ── latar farm blur + scanline (persis seperti game) ── */
  .bg {
    position: absolute;
    inset: -20px;
    background: url("http://127.0.0.1:5173/assets/pixel/farm-bg.png") center / cover no-repeat;
    image-rendering: pixelated;
    filter: blur(4px) brightness(0.55) saturate(0.9);
  }
  .scan {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 2px, rgba(0, 0, 0, 0) 2px 4px);
  }

  /* ── popup bingkai kayu 9-slice ── */
  .popup {
    position: relative;
    width: 560px;
    border: 32px solid transparent;
    border-image: url("http://127.0.0.1:5173/assets/pixel/shop-frame.png") 32 / 32px / 0 repeat;
    background-color: #f2e2c2;
    background-clip: padding-box;
    background-image:
      radial-gradient(circle at 22% 12%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%),
      repeating-linear-gradient(90deg, rgba(139, 101, 56, 0.05) 0 2px, rgba(0, 0, 0, 0) 2px 6px);
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.55);
    image-rendering: pixelated;
  }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #5a3418;
    border-bottom: 4px solid #2a1608;
    box-shadow: inset 0 4px 0 #7c4a22, inset 0 -4px 0 #3d2210;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: "Press Start 2P", monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #f7e7c6;
    text-shadow: 2px 2px 0 #2a1608;
  }
  .title img { width: 26px; height: 26px; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #2a1608); }
  .x {
    width: 34px; height: 34px;
    border: 3px solid #2a1608;
    background: #8a5a34;
    color: #f7e7c6;
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    line-height: 1;
    box-shadow: inset 0 3px 0 #b98255, inset 0 -3px 0 #5e3517;
  }

  .body { padding: 16px 20px 18px; }

  /* ── judul bagian ── */
  .sec + .sec { margin-top: 16px; }
  .sec-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #4a2e14;
  }
  .sec-title::after {
    content: "";
    flex: 1;
    height: 4px;
    background-image: repeating-linear-gradient(to right, #c9a97a 0 8px, rgba(0, 0, 0, 0) 8px 16px);
    background-size: 16px 4px;
    background-repeat: repeat-x;
  }

  /* ── grid slot ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .slot {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #2a1608;
    background: #e8d3ac;
    box-shadow: inset 0 3px 0 #c9a97a, inset 0 -3px 0 #b98d62;
  }
  .slot img { width: 68px; height: 68px; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 rgba(60, 36, 16, 0.28)); }
  .slot .cnt {
    position: absolute;
    right: 3px;
    bottom: 2px;
    font-family: "Press Start 2P", monospace;
    font-size: 9px;
    color: #3b2410;
    text-shadow:
      1px 0 0 #f2e2c2, -1px 0 0 #f2e2c2,
      0 1px 0 #f2e2c2, 0 -1px 0 #f2e2c2,
      1px 1px 0 #f2e2c2, -1px -1px 0 #f2e2c2;
  }
  .slot.empty { background: #dcc7a0; }
  .slot.empty img { opacity: 0.28; filter: grayscale(0.7); }
  .slot.empty .cnt { color: #8a7355; }

  .hint {
    margin: 14px 0 0;
    padding-top: 12px;
    background-image: repeating-linear-gradient(to right, #c9a97a 0 8px, rgba(0, 0, 0, 0) 8px 16px);
    background-size: 16px 4px;
    background-repeat: repeat-x;
    background-position: top left;
    font-family: "VT323", monospace;
    font-size: 16px;
    line-height: 1.25;
    color: #7a5a38;
  }

  /* ── footer ── */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    background: #e8d3ac;
    border-top: 4px solid #2a1608;
    box-shadow: inset 0 4px 0 #f6ead0;
  }
  .total {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "VT323", monospace;
    font-size: 19px;
    line-height: 1;
    color: #4a2e14;
  }
  .total b { font-family: "Press Start 2P", monospace; font-size: 10px; color: #2a1608; }
  .btn-green {
    height: 46px;
    padding: 0 20px;
    border: 3px solid #143d22;
    background: #3f9d5a;
    color: #f2ffe9;
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    text-shadow: 2px 2px 0 #1e5a32;
    box-shadow: inset 0 4px 0 #6ccb86, inset 0 -5px 0 #2a6b3b, 0 5px 0 #143d22;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scan"></div>

  <div class="popup">
    <div class="head">
      <div class="title">
        <img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-sprout.png" alt="" />
        <span>INVENTORY</span>
      </div>
      <div class="x">X</div>
    </div>

    <div class="body">
      <div class="sec">
        <div class="sec-title">BIBIT TANAMAN</div>
        <div class="grid">
          <div class="slot"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-jagung.png" alt="" /><span class="cnt">12</span></div>
          <div class="slot"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-tomat.png" alt="" /><span class="cnt">8</span></div>
          <div class="slot"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-wortel.png" alt="" /><span class="cnt">4</span></div>
          <div class="slot"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-kentang.png" alt="" /><span class="cnt">3</span></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">HASIL PANEN</div>
        <div class="grid">
          <div class="slot"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-jagung.png" alt="" /><span class="cnt">9</span></div>
          <div class="slot"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-tomat.png" alt="" /><span class="cnt">6</span></div>
          <div class="slot empty"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-wortel.png" alt="" /><span class="cnt">0</span></div>
          <div class="slot empty"><img src="http://127.0.0.1:5173/assets/pixel/icon-pixel-kentang.png" alt="" /><span class="cnt">0</span></div>
        </div>
      </div>

      <p class="hint">Tiap kotak bisa menumpuk sampai 64. Hasil panen di bawah ini yang dijual di minimarket.</p>
    </div>

    <div class="foot">
      <div class="total">Total panen <b>15 unit</b></div>
      <div class="btn-green">TUTUP</div>
    </div>
  </div>
</body>
</html>
